<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
{% assign og_image = page.image | default: 'https://cosmok82.github.io/Strict_LLM_Memory_System/thumbnail.png' %}
<title>{{ page.title | default: site.title }}</title>
<meta name="description" content="{{ page.description | default: site.description }}">
<meta property="og:type" content="{{ page.og_type | default: 'website' }}">
<meta property="og:site_name" content="{{ site.title }}">
<meta property="og:title" content="{{ page.title | default: site.title }}">
<meta property="og:description" content="{{ page.description | default: site.description }}">
<meta property="og:url" content="{{ site.url }}{{ site.baseurl }}{{ page.url }}">
<meta property="og:image" content="{{ og_image }}">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{ page.title | default: site.title }}">
<meta name="twitter:description" content="{{ page.description | default: site.description }}">
<meta name="twitter:image" content="{{ og_image }}">
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; font: 16px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 2.5rem 1.25rem 4rem; }
  h1, h2, h3 { line-height: 1.25; }
  img { max-width: 100%; height: auto; }
  code { font-size: 0.9em; }
  table { border-collapse: collapse; width: 100%; margin: 1.25rem 0; font-size: 0.95em; }
  th, td { border: 1px solid #8884; padding: .45rem .6rem; text-align: left; }
  a { color: inherit; }
</style>
</head>
<body>
<main>
{{ content }}
</main>
</body>
</html>
